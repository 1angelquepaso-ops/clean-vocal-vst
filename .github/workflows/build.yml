name: Build Windows plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build VST3 + CLAP
        run: cargo xtask bundle clean_vocal --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "target/bundled/Clean Vocal.vst3" dist/
          Copy-Item "target/bundled/Clean Vocal.clap" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Clean-Vocal-Windows.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Vocal-Windows
          path: Clean-Vocal-Windows.zip

      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clean Vocal (latest build)
          body: |
            Download **Clean-Vocal-Windows.zip** below, unzip it, and copy the `Clean Vocal.vst3` folder into
            `C:\Program Files\Common Files\VST3\`. Then rescan plugins in FL Studio.
          files: Clean-Vocal-Windows.zip
          make_latest: true
